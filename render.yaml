# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets are NOT stored here. Set GEMINI_API_KEY in the Render dashboard.
services:
  - type: web
    name: yieldguard
    runtime: python
    plan: free
    # Installs the API, then builds the Next.js frontend to web/out (served by FastAPI).
    buildCommand: pip install -r backend/requirements.txt && cd web && npm ci && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: METNO_CONTACT     # email or URL for MET Norway's User-Agent; set in the dashboard
        sync: false
      - key: DATAGOV_API_KEY   # data.gov.in key for mandi prices; set in the dashboard
        sync: false
      - key: NODE_VERSION
        value: 22.12.0
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.8-flash
